<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Flight Radar</title>
    
    <!-- Using Leaflet JS which is 100% stable in secure iframe sandboxes -->
    <link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet" />
    
    <style>
        /* Base Reset and Layout */
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            background-color: #050505; 
            color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            overflow: hidden; 
        }
        
        #map { 
            width: 100%; 
            height: 100%; 
            position: absolute; 
            top: 0; 
            left: 0; 
            background-color: #000; /* Dark background behind map tiles */
        }

        /* Sleek, Dark Mode UI Overlay */
        #ui-container { 
            position: absolute; 
            top: 30px; 
            left: 30px; 
            z-index: 1000; /* Leaflet UI layer requires higher z-index */
            background: rgba(10, 10, 10, 0.85); 
            backdrop-filter: blur(10px); 
            padding: 20px; 
            border-radius: 12px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
            pointer-events: none; 
        }
        
        .title-group { 
            display: flex; 
            align-items: center; 
            margin-bottom: 8px; 
        }
        
        .pulse-dot { 
            width: 8px; 
            height: 8px; 
            background-color: #fff; 
            border-radius: 50%; 
            margin-right: 12px; 
            box-shadow: 0 0 10px #fff; 
            animation: pulse 1.5s infinite; 
        }
        
        h1 { 
            margin: 0; 
            font-size: 14px; 
            font-weight: 600; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            color: #eee; 
        }
        
        p { 
            margin: 0; 
            font-size: 11px; 
            color: #888; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }
        
        #status { 
            color: #ccc; 
            margin-top: 4px; 
        }
        
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(255, 255, 255, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }

        /* Plane Markers & Animation */
        .plane-icon {
            /* Smoothly animate planes across the screen as new data arrives */
            transition: transform 1.5s linear; 
            pointer-events: auto;
        }
        
        .plane-wrapper {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.5s ease; /* Smooth rotation */
            /* This gives the planes the bright, map-like 'glow' from the image */
            filter: drop-shadow(0px 0px 5px rgba(255,255,255,0.9));
        }

        /* Custom Popup Styling for Dark Theme */
        .leaflet-popup-content-wrapper {
            background-color: rgba(20, 20, 20, 0.95) !important;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px !important;
            color: white !important;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8) !important;
        }
        .leaflet-popup-tip {
            background-color: rgba(20, 20, 20, 0.95) !important;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-left: 1px solid rgba(255, 255, 255, 0.2);
        }
        .leaflet-popup-close-button {
            color: #fff !important;
            padding-top: 5px !important;
            padding-right: 5px !important;
        }

        /* Clean, floating text labels for flight Call signs */
        .leaflet-tooltip.plane-label {
            background-color: transparent;
            border: transparent;
            box-shadow: none;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 0.5px;
            text-shadow: 1px 1px 2px #000, -1px -1px 2px #000, 1px -1px 2px #000, -1px 1px 2px #000;
        }
        /* Hide default tooltip arrows */
        .leaflet-tooltip.plane-label::before, .leaflet-tooltip.plane-label::after {
            display: none !important;
        }

        /* Customize Leaflet Controls for Dark Mode */
        .leaflet-control-zoom a {
            background-color: rgba(20, 20, 20, 0.9) !important;
            color: #fff !important;
            border-color: rgba(255, 255, 255, 0.1) !important;
        }
        .leaflet-control-zoom a:hover {
            background-color: #333 !important;
        }
        .leaflet-control-attribution {
            background-color: rgba(0, 0, 0, 0.5) !important;
            color: #aaa !important;
        }
        .leaflet-control-attribution a {
            color: #fff !important;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="ui-container">
        <div class="title-group">
            <div class="pulse-dot"></div>
            <h1>Live Global Airspace</h1>
        </div>
        <p>Source: OpenSky Network (Real-Time)</p>
        <p id="status">Establishing radar connection...</p>
    </div>

    <!-- Leaflet JS Library -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize Leaflet Map
        const map = L.map('map', {
            center: [19.4326, -99.1332], // Starts near Mexico
            zoom: 4,
            zoomControl: false // Disable default to move it to bottom-right
        });

        // Add Zoom Control to Bottom Right
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Add Carto Dark Matter Basemap (No complex relative URLs, completely bypasses iframe strict errors)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://carto.com/">CARTO</a>, &copy; <a href="https://opensky-network.org">OpenSky Network</a>',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        // State variables
        let markers = {};
        let lastStates = [];
        let fetchInterval;

        const airplaneSvgPath = "M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z";

        // Draw and update airplanes
        function renderPlanes(states) {
            if (!states) return;
            
            const bounds = map.getBounds().pad(0.2); // Only render planes visible in the viewport + 20% margin
            const currentIds = new Set();
            const showLabels = map.getZoom() >= 7; // Show text callsigns when zoomed in

            states.forEach(state => {
                const id = state[0];
                const lat = state[6];
                const lon = state[5];
                const track = state[10] || 0;
                const callsign = state[1] ? state[1].trim() : 'N/A';
                
                if (!lat || !lon) return;
                const latLng = [lat, lon];
                
                // PERFORMANCE FIX: Only render HTML markers for planes inside the camera view
                if (bounds.contains(latLng)) {
                    currentIds.add(id);
                    
                    if (markers[id]) {
                        // UPDATE existing plane (smooth CSS animation handles the glide)
                        markers[id].setLatLng(latLng);
                        
                        // Update Rotation
                        const el = markers[id].getElement();
                        if (el) {
                            const wrapper = el.querySelector('.plane-wrapper');
                            if (wrapper) wrapper.style.transform = `rotate(${track}deg)`;
                        }

                        // Toggle Text Labels based on Zoom
                        if (showLabels && !markers[id].getTooltip()) {
                             markers[id].bindTooltip(callsign, { permanent: true, direction: 'top', className: 'plane-label', offset: [0, -12] });
                        } else if (!showLabels && markers[id].getTooltip()) {
                             markers[id].unbindTooltip();
                        }
                    } else {
                        // CREATE new plane marker
                        const iconHtml = `
                            <div class="plane-wrapper" style="transform: rotate(${track}deg);">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="#ffffff">
                                    <path d="${airplaneSvgPath}"/>
                                </svg>
                            </div>
                        `;
                        const icon = L.divIcon({
                            className: 'plane-icon',
                            html: iconHtml,
                            iconSize: [20, 20],
                            iconAnchor: [10, 10]
                        });
                        
                        const marker = L.marker(latLng, { icon: icon });
                        
                        if (showLabels) {
                            marker.bindTooltip(callsign, { permanent: true, direction: 'top', className: 'plane-label', offset: [0, -12] });
                        }

                        // Detailed Click Popup
                        marker.bindPopup(`
                            <strong style="font-size: 15px; display: block; border-bottom: 1px solid #444; padding-bottom: 6px; margin-bottom: 6px;">✈ ${callsign}</strong>
                            <div style="font-size: 12px; line-height: 1.6; color: #ccc;">
                                Origin: ${state[2] || 'Unknown'}<br>
                                Altitude: ${Math.round(state[13] || 0).toLocaleString()} m<br>
                                Speed: ${Math.round((state[9] || 0) * 3.6)} km/h<br>
                                Heading: ${Math.round(track)}°
                            </div>
                        `);
                        
                        marker.addTo(map);
                        markers[id] = marker;
                    }
                }
            });

            // CLEANUP: Remove planes that flew off-screen or disappeared from radar
            Object.keys(markers).forEach(id => {
                if (!currentIds.has(id)) {
                    map.removeLayer(markers[id]);
                    delete markers[id];
                }
            });
        }

        async function fetchFlightData() {
            const statusEl = document.getElementById('status');
            try {
                // Fetch live vectors globally
                const response = await fetch('https://opensky-network.org/api/states/all', { cache: "no-store" });
                
                if (response.status === 429) {
                    statusEl.innerText = 'Radar congested (Rate Limit). Holding pattern...';
                    statusEl.style.color = '#ffaa00';
                    return;
                }
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const data = await response.json();
                
                // Filter airborne valid flights
                lastStates = data.states.filter(state => state[5] !== null && state[6] !== null && !state[8]);
                
                renderPlanes(lastStates);
                
                statusEl.innerText = `Tracking ${lastStates.length.toLocaleString()} global airborne flights`;
                statusEl.style.color = '#ccc';

            } catch (error) {
                console.error('Radar Error:', error);
                statusEl.innerText = 'Radar connection interrupted. Reconnecting...';
                statusEl.style.color = '#ff4444';
            }
        }

        // Initialize and poll every 15 seconds
        fetchFlightData();
        fetchInterval = setInterval(fetchFlightData, 15000);

        // Instantly re-render nearby planes when the user pans/zooms the map
        map.on('moveend', () => {
            renderPlanes(lastStates);
        });

    </script>
</body>
</html>
