<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Live Global Flight Radar — track thousands of airborne flights in real time using OpenSky Network data, rendered on a sleek dark CARTO basemap.">
    <meta name="theme-color" content="#050505">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <!-- Content Security Policy — restrict to only what the page needs -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none';
                   style-src 'self' 'unsafe-inline' https://unpkg.com;
                   script-src 'self' 'unsafe-inline' https://unpkg.com;
                   connect-src https://opensky-network.org;
                   img-src data: https://*.basemaps.cartocdn.com https://*.cartocdn.com;
                   font-src 'none';
                   frame-src 'none';
                   base-uri 'self';
                   form-action 'none';
                   upgrade-insecure-requests;">

    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta http-equiv="Permissions-Policy" content="geolocation=(), camera=(), microphone=()">

    <title>Live Flight Radar — CARTO</title>

    <!-- Leaflet CSS with SRI integrity check -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin="anonymous" />

    <style>
        /* ─── Reset & Base ───────────────────────────────────── */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #050505;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                         Helvetica, Arial, sans-serif;
            overflow: hidden;
            /* Enable GPU compositing for silky-smooth rendering at high refresh rates */
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ─── Map ────────────────────────────────────────────── */
        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            inset: 0;
            background-color: #000;
            /* Force GPU layer to avoid repaints on scroll/pan */
            will-change: transform;
            contain: strict;
        }

        /* ─── HUD / UI Overlay ───────────────────────────────── */
        #ui-container {
            position: absolute;
            top: env(safe-area-inset-top, 16px);
            left: env(safe-area-inset-left, 16px);
            z-index: 1000;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 16px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            /* prevent repaints when status text changes */
            will-change: contents;
            max-width: calc(100vw - 32px);
        }

        .title-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .pulse-dot {
            flex-shrink: 0;
            width: 8px;
            height: 8px;
            background-color: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px #fff;
            animation: pulse 1.5s ease-in-out infinite;
        }

        h1 {
            margin: 0;
            font-size: clamp(11px, 2vw, 14px);
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #eee;
            white-space: nowrap;
        }

        .subtitle {
            margin: 0;
            font-size: clamp(9px, 1.5vw, 11px);
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #status {
            color: #ccc;
            margin-top: 3px;
        }

        /* ─── Pulse Animation (GPU-composited, no layout thrash) */
        @keyframes pulse {
            0%   { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255,255,255,0.7); }
            70%  { transform: scale(1);    box-shadow: 0 0 0 6px rgba(255,255,255,0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255,255,255,0); }
        }

        /* ─── Plane Markers ──────────────────────────────────── */
        .plane-icon {
            pointer-events: auto;
            /* Let CSS handle smooth movement: only composited props */
            will-change: transform;
        }

        .plane-wrapper {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            /* GPU-composited rotation — zero layout cost */
            will-change: transform;
            transition: transform 0.5s ease;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.9));
        }

        /* ─── Dark-mode Leaflet Popups ───────────────────────── */
        .leaflet-popup-content-wrapper {
            background-color: rgba(20, 20, 20, 0.95) !important;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px !important;
            color: #fff !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8) !important;
        }

        .leaflet-popup-tip {
            background-color: rgba(20, 20, 20, 0.95) !important;
        }

        .leaflet-popup-close-button {
            color: #fff !important;
            padding: 5px 5px 0 0 !important;
        }

        /* ─── Callsign Labels ────────────────────────────────── */
        .leaflet-tooltip.plane-label {
            background-color: transparent;
            border: none;
            box-shadow: none;
            color: #fff;
            font-family: inherit;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 1px 1px 2px #000, -1px -1px 2px #000,
                         1px -1px 2px #000, -1px  1px 2px #000;
        }

        .leaflet-tooltip.plane-label::before,
        .leaflet-tooltip.plane-label::after {
            display: none !important;
        }

        /* ─── Dark-mode Leaflet Controls ─────────────────────── */
        .leaflet-control-zoom a {
            background-color: rgba(20, 20, 20, 0.9) !important;
            color: #fff !important;
            border-color: rgba(255, 255, 255, 0.1) !important;
        }

        .leaflet-control-zoom a:hover {
            background-color: #333 !important;
        }

        .leaflet-control-attribution {
            background-color: rgba(0, 0, 0, 0.5) !important;
            color: #aaa !important;
        }

        .leaflet-control-attribution a {
            color: #ccc !important;
        }

        /* ─── Responsive tweaks (phones / small screens) ─────── */
        @media (max-width: 480px) {
            #ui-container {
                top: calc(env(safe-area-inset-top, 0px) + 10px);
                left: calc(env(safe-area-inset-left, 0px) + 10px);
                padding: 12px 14px;
                border-radius: 10px;
            }

            .plane-wrapper {
                width: 16px;
                height: 16px;
            }

            .plane-wrapper svg {
                width: 16px;
                height: 16px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .pulse-dot { animation: none; }
            .plane-wrapper { transition: none; }
        }
    </style>
</head>
<body>
    <div id="map" role="application" aria-label="Live global flight radar map"></div>

    <div id="ui-container" role="status" aria-live="polite" aria-atomic="true">
        <div class="title-group">
            <div class="pulse-dot" aria-hidden="true"></div>
            <h1>Live Global Airspace</h1>
        </div>
        <p class="subtitle">Source: OpenSky Network (Real-Time)</p>
        <p class="subtitle" id="status">Establishing radar connection…</p>
    </div>

    <!-- Leaflet JS with SRI integrity check -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV/XN2GqNg="
            crossorigin="anonymous"></script>

    <script>
        'use strict';

        // ── Map initialisation ───────────────────────────────────────────────
        const map = L.map('map', {
            center: [19.4326, -99.1332],
            zoom: 4,
            zoomControl: false
        });

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://carto.com/" rel="noopener noreferrer">CARTO</a> &copy; <a href="https://opensky-network.org" rel="noopener noreferrer">OpenSky Network</a>',
            subdomains: 'abcd',
            maxZoom: 20,
            // Pre-fetch neighbouring tiles to remove pop-in during panning
            keepBuffer: 4,
            updateWhenIdle: false,
            updateWhenZooming: false
        }).addTo(map);

        // ── State ────────────────────────────────────────────────────────────
        const markers   = {};
        let   lastStates = [];
        let   fetchTimer;
        let   renderPending = false;

        const PLANE_SVG_PATH =
            'M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z';

        // Cache media query once; update on resize for accurate icon sizing
        const mqlSmall = window.matchMedia('(max-width: 480px)');
        let isSmallScreen = mqlSmall.matches;
        mqlSmall.addEventListener('change', e => { isSmallScreen = e.matches; });

        // ── Plane rendering (viewport-culled for perf) ───────────────────────
        function renderPlanes(states) {
            if (!states || !states.length) return;

            const bounds     = map.getBounds().pad(0.2);
            const zoom       = map.getZoom();
            const showLabels = zoom >= 7;
            const screenSize = isSmallScreen ? 16 : 20;
            const currentIds = new Set();

            for (const state of states) {
                const id       = state[0];
                const lat      = state[6];
                const lon      = state[5];
                const track    = state[10] || 0;
                const callsign = (state[1] || '').trim() || 'N/A';

                if (lat == null || lon == null) continue;
                const latLng = [lat, lon];

                if (!bounds.contains(latLng)) {
                    // Off-screen — remove if it was visible before
                    if (markers[id]) {
                        map.removeLayer(markers[id]);
                        delete markers[id];
                    }
                    continue;
                }

                currentIds.add(id);

                if (markers[id]) {
                    // Smooth-move existing marker (Leaflet uses CSS transform)
                    markers[id].setLatLng(latLng);

                    const el = markers[id].getElement();
                    if (el) {
                        const wrapper = el.querySelector('.plane-wrapper');
                        if (wrapper) wrapper.style.transform = `rotate(${track}deg)`;
                    }

                    if (showLabels && !markers[id].getTooltip()) {
                        markers[id].bindTooltip(callsign, {
                            permanent: true, direction: 'top',
                            className: 'plane-label', offset: [0, -12]
                        });
                    } else if (!showLabels && markers[id].getTooltip()) {
                        markers[id].unbindTooltip();
                    }
                } else {
                    // Create new marker
                    const iconHtml = `<div class="plane-wrapper" style="transform:rotate(${track}deg)">
                        <svg width="${screenSize}" height="${screenSize}" viewBox="0 0 24 24" fill="#fff" aria-hidden="true">
                            <path d="${PLANE_SVG_PATH}"/>
                        </svg></div>`;

                    const icon = L.divIcon({
                        className: 'plane-icon',
                        html: iconHtml,
                        iconSize:   [screenSize, screenSize],
                        iconAnchor: [screenSize / 2, screenSize / 2]
                    });

                    const marker = L.marker(latLng, { icon });

                    if (showLabels) {
                        marker.bindTooltip(callsign, {
                            permanent: true, direction: 'top',
                            className: 'plane-label', offset: [0, -12]
                        });
                    }

                    const alt   = Math.round(state[13] || 0).toLocaleString();
                    const speed = Math.round((state[9] || 0) * 3.6);
                    const hdg   = Math.round(track);
                    const orig  = state[2] || 'Unknown';

                    marker.bindPopup(
                        `<strong style="font-size:15px;display:block;border-bottom:1px solid #444;padding-bottom:6px;margin-bottom:6px;">✈ ${escapeHtml(callsign)}</strong>` +
                        `<div style="font-size:12px;line-height:1.7;color:#ccc;">` +
                        `Origin: ${escapeHtml(orig)}<br>` +
                        `Altitude: ${alt} m<br>` +
                        `Speed: ${speed} km/h<br>` +
                        `Heading: ${hdg}°</div>`
                    );

                    marker.addTo(map);
                    markers[id] = marker;
                }
            }

            // Remove markers that are no longer in the data set
            for (const id of Object.keys(markers)) {
                if (!currentIds.has(id)) {
                    map.removeLayer(markers[id]);
                    delete markers[id];
                }
            }
        }

        // Simple HTML escaper to prevent XSS from API data
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // ── Data fetching ────────────────────────────────────────────────────
        async function fetchFlightData() {
            const statusEl = document.getElementById('status');
            try {
                const response = await fetch(
                    'https://opensky-network.org/api/states/all',
                    { cache: 'no-store', signal: AbortSignal.timeout(10000) }
                );

                if (response.status === 429) {
                    statusEl.textContent = 'Radar congested (rate limit). Holding pattern…';
                    statusEl.style.color = '#ffaa00';
                    return;
                }
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();

                if (!data || !Array.isArray(data.states)) {
                    throw new Error(
                        `Unexpected API response: got ${typeof data}, ` +
                        `states=${data ? typeof data.states : 'n/a'}`
                    );
                }

                // Keep only airborne flights with valid coordinates
                lastStates = data.states.filter(
                    s => s[5] != null && s[6] != null && !s[8]
                );

                renderPlanes(lastStates);

                statusEl.textContent =
                    `Tracking ${lastStates.length.toLocaleString()} global airborne flights`;
                statusEl.style.color = '#ccc';

            } catch (err) {
                if (err.name === 'AbortError') {
                    statusEl.textContent = 'Radar timeout. Reconnecting…';
                } else {
                    statusEl.textContent = 'Radar connection interrupted. Reconnecting…';
                }
                statusEl.style.color = '#ff4444';
                console.error('[FlightRadar] fetch error:', err.message);
            }
        }

        // ── Debounced re-render on map move ──────────────────────────────────
        function scheduleRender() {
            if (renderPending) return;
            renderPending = true;
            requestAnimationFrame(() => {
                renderPlanes(lastStates);
                renderPending = false;
            });
        }

        // ── Boot ─────────────────────────────────────────────────────────────
        fetchFlightData();
        fetchTimer = setInterval(fetchFlightData, 15000);

        map.on('moveend zoomend', scheduleRender);
    </script>
</body>
</html>
