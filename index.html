<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Live Global Flight Radar — track thousands of airborne flights in real time using OpenSky Network data, rendered on a sleek dark CARTO basemap.">
    <meta name="theme-color" content="#050505">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <!-- Content Security Policy — restrict to only what the page needs.
         [CHANGED 2026-08-30] connect-src also allows the two community ADS-B APIs
         (api.adsb.lol, opendata.adsb.fi) as live data sources.
         [CHANGED 2026-08-30 — incident #3] img-src now allows *.arcgisonline.com —
         CARTO raster tiles now carry an "API key required" watermark for keyless
         use (CARTO policy change, 2026), so the default basemap switched to Esri's
         key-free World Dark Gray canvas. CARTO remains available as an opt-in
         (CONFIG.CARTO_KEY) for the original Dark Matter look. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none';
                   style-src 'self' 'unsafe-inline';
                   script-src 'self' 'unsafe-inline';
                   connect-src https://opensky-network.org https://api.adsb.lol https://opendata.adsb.fi;
                   img-src data: https://*.basemaps.cartocdn.com https://*.cartocdn.com https://tile.openstreetmap.org https://*.arcgisonline.com;
                   font-src 'none';
                   frame-src 'none';
                   base-uri 'self';
                   form-action 'none';
                   upgrade-insecure-requests;">

    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta http-equiv="Permissions-Policy" content="geolocation=(), camera=(), microphone=()">

    <title>Live Flight Radar — CARTO</title>

    <!-- Leaflet CSS — self-hosted from the official npm leaflet@1.9.4 tarball
         (SRI hash computed from the vendored file; see vendor/leaflet/LICENSE) -->
    <link rel="stylesheet"
          href="vendor/leaflet/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin="anonymous" />

    <style>
        /* ─── Reset & Base ───────────────────────────────────── */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #050505;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                         Helvetica, Arial, sans-serif;
            overflow: hidden;
            /* Enable GPU compositing for silky-smooth rendering at high refresh rates */
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ─── Map ────────────────────────────────────────────── */
        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            inset: 0;
            background-color: #000;
            /* Force GPU layer to avoid repaints on scroll/pan */
            will-change: transform;
            contain: strict;
        }

        /* ─── HUD / UI Overlay ───────────────────────────────── */
        #ui-container {
            position: absolute;
            top: env(safe-area-inset-top, 16px);
            left: env(safe-area-inset-left, 16px);
            z-index: 1000;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 16px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            /* prevent repaints when status text changes */
            will-change: contents;
            max-width: calc(100vw - 32px);
        }

        .title-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .pulse-dot {
            flex-shrink: 0;
            width: 8px;
            height: 8px;
            background-color: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px #fff;
            animation: pulse 1.5s ease-in-out infinite;
        }

        h1 {
            margin: 0;
            font-size: clamp(11px, 2vw, 14px);
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #eee;
            white-space: nowrap;
        }

        .subtitle {
            margin: 0;
            font-size: clamp(9px, 1.5vw, 11px);
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #status {
            color: #ccc;
            margin-top: 3px;
        }

        /* ─── Pulse Animation (GPU-composited, no layout thrash) */
        @keyframes pulse {
            0%   { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255,255,255,0.7); }
            70%  { transform: scale(1);    box-shadow: 0 0 0 6px rgba(255,255,255,0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255,255,255,0); }
        }

        /* ─── Plane Markers ──────────────────────────────────── */
        .plane-icon {
            pointer-events: auto;
            /* Let CSS handle smooth movement: only composited props */
            will-change: transform;
            /* [CHANGED 2026-08-30] Leaflet positions markers via `transform: translate3d(...)`.
               Animating that property makes each 1 s dead-reckoning tick glide instead of
               teleport-jumping (see DR tick in the script below). */
            transition: transform 1s linear;
        }

        /* [ADDED 2026-08-30] While zooming, Leaflet re-projects every marker's position —
           the 1 s glide transition would make planes "swim" behind the tiles, so it is
           suspended for the duration of the zoom and re-enabled shortly after zoomend. */
        .map-zooming .plane-icon,
        .map-zooming .leaflet-tooltip.plane-label,
        .map-zooming .leaflet-popup {
            transition: none !important;
        }

        .plane-wrapper {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            /* GPU-composited rotation — zero layout cost */
            will-change: transform;
            transition: transform 0.5s ease;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.9));
        }

        /* ─── Dark-mode Leaflet Popups ───────────────────────── */
        .leaflet-popup-content-wrapper {
            background-color: rgba(20, 20, 20, 0.95) !important;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px !important;
            color: #fff !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8) !important;
        }

        .leaflet-popup-tip {
            background-color: rgba(20, 20, 20, 0.95) !important;
        }

        .leaflet-popup-close-button {
            color: #fff !important;
            padding: 5px 5px 0 0 !important;
        }

        /* [ADDED 2026-08-30] Open popups are also placed via transform — give them the
           same 1 s glide so an open popup stays glued to its (moving) aircraft. */
        .leaflet-popup {
            transition: transform 1s linear;
        }

        /* ─── Callsign Labels ────────────────────────────────── */
        .leaflet-tooltip.plane-label {
            background-color: transparent;
            border: none;
            box-shadow: none;
            color: #fff;
            font-family: inherit;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 1px 1px 2px #000, -1px -1px 2px #000,
                         1px -1px 2px #000, -1px  1px 2px #000;
            /* [ADDED 2026-08-30] keep labels in lock-step with the gliding markers */
            transition: transform 1s linear;
        }

        .leaflet-tooltip.plane-label::before,
        .leaflet-tooltip.plane-label::after {
            display: none !important;
        }

        /* [ADDED 2026-08-30 — incident #2] Dark-mode tint for the OpenStreetMap
           basemap fallback, so the map stays visually dark when the CARTO CDN
           is unreachable. Applied per-tile-image (uniform filter, no seams). */
        .osm-dark-filter {
            filter: invert(1) hue-rotate(180deg) brightness(0.85) contrast(0.85);
        }

        /* ─── Dark-mode Leaflet Controls ─────────────────────── */
        .leaflet-control-zoom a {
            background-color: rgba(20, 20, 20, 0.9) !important;
            color: #fff !important;
            border-color: rgba(255, 255, 255, 0.1) !important;
        }

        .leaflet-control-zoom a:hover {
            background-color: #333 !important;
        }

        .leaflet-control-attribution {
            background-color: rgba(0, 0, 0, 0.5) !important;
            color: #aaa !important;
        }

        .leaflet-control-attribution a {
            color: #ccc !important;
        }

        /* ─── Responsive tweaks (phones / small screens) ─────── */
        @media (max-width: 480px) {
            #ui-container {
                top: calc(env(safe-area-inset-top, 0px) + 10px);
                left: calc(env(safe-area-inset-left, 0px) + 10px);
                padding: 12px 14px;
                border-radius: 10px;
            }

            .plane-wrapper {
                width: 16px;
                height: 16px;
            }

            .plane-wrapper svg {
                width: 16px;
                height: 16px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .pulse-dot { animation: none; }
            .plane-wrapper { transition: none; }
            /* [ADDED 2026-08-30] honour reduced-motion for the new glide transitions too */
            .plane-icon, .leaflet-popup, .leaflet-tooltip.plane-label { transition: none; }
        }
    </style>
</head>
<body>
    <div id="map" role="application" aria-label="Live global flight radar map"></div>

    <div id="ui-container" role="status" aria-live="polite" aria-atomic="true">
        <div class="title-group">
            <div class="pulse-dot" aria-hidden="true"></div>
            <h1>Live Global Airspace</h1>
        </div>
        <!-- [CHANGED 2026-08-30] subtitle credits all live data sources honestly -->
        <p class="subtitle">Sources: OpenSky Network &middot; adsb.fi &middot; adsb.lol (Real-Time)</p>
        <p class="subtitle" id="status">Establishing radar connection…</p>
    </div>

    <!-- Leaflet JS — self-hosted from the official npm leaflet@1.9.4 tarball
         [CHANGED 2026-08-30 — incident #2] was loaded from unpkg.com; when that CDN
         is unreachable the whole map silently vanished (black page). Now same-origin. -->
    <script src="vendor/leaflet/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin="anonymous"></script>

    <script>
        'use strict';

        // ── Boot guard ─────────────────────────────────────────────────────────
        // [ADDED 2026-08-30 — incident #2] if the map engine itself fails to load
        // (missing/corrupted vendored file, extension blocking), say so loudly in
        // the HUD instead of leaving a silent black page that looks "broken".
        if (typeof L === 'undefined') {
            const el = document.getElementById('status');
            el.textContent = 'Map engine failed to load (vendor/leaflet). Run /diag.html';
            el.style.color = '#ff4444';
            throw new Error('Leaflet failed to load — radar cannot start');
        }

        /* ═══════════════════════════════════════════════════════════════════════
           LIVE FLIGHT RADAR — data engine v2 (rewritten 2026-08-30)

           WHY THE REWRITE?  The original polled OpenSky's GLOBAL /states/all
           endpoint every 15 s. OpenSky's anonymous tier (no API key) allows only
           400 credits/day and a global fetch costs 4 credits — so the old app
           exhausted the whole daily quota in ~25 minutes and then sat in
           "Radar congested" until UTC midnight.

           WHAT CHANGED (same UI, new methodology):
             • Live sources with automatic health-based fan-out (2026-08-30):
                 - adsb.fi   (opendata.adsb.fi/api, ADSB-X schema, ≤250 NM,
                              1 req/s etiquette) tried first when zoomed in
                 - adsb.lol  (api.adsb.lol/v2, same schema) tried second
                 - OpenSky   (anonymous, credit-budgeted) used when zoomed out,
                              queried with the *viewport bounding box* (1–4 credits
                              depending on area) on credit-aware intervals
               Whichever endpoint the user's browser can actually reach serves the
               data — a network that blocks/CORS-blocks one simply falls through
               to the next. 12 s refresh when zoomed in via the community APIs.
             • Dead-reckoning interpolation: each aircraft is advanced along its
               true track at its reported ground speed between API fixes, so
               planes glide continuously instead of teleporting every poll.
             • Self-scheduling fetch loop (no overlapping requests), exponential
               back-off on HTTP 429, pause when the tab is hidden.
             • Popups/labels refreshed on every fix (were frozen at creation),
               shortest-path rotation (no more 360° spin-back), dateline-safe
               culling & longitude wrapping, feature-detected fetch timeout.
           Full audit trail: see REPORT.md in the repository root.
           ═══════════════════════════════════════════════════════════════════════ */

        // ── Tunables ──────────────────────────────────────────────────────────
        // (URL bases live in the PURE-LOGIC block below so they are single-sourced
        //  and unit-testable; CFG only holds behaviour tunables.)
        const CFG = {
            ADSB_POLL_MS: 12000,          // adsb.lol etiquette is ≤1 req/s — 12 s is safe
            OPENSKY_POLL_MS: 90000,       // small/medium bbox (≤2 credits per request)
            OPENSKY_POLL_GLOBAL_MS: 150000, // world/large views (3–4 credits per request)

            FETCH_TIMEOUT_MS: 12000,      // abort stale requests
            DR_TICK_MS: 1000,             // dead-reckoning cadence (CSS glides between ticks)
            MAX_DR_AGE_LOCAL_MS: 120000,  // stop extrapolating a stale fix (zoomed in)
            MAX_DR_AGE_GLOBAL_MS: 300000, // ... more tolerance when zoomed out

            LABEL_ZOOM: 7,                // zoom ≥ 7 → permanent callsign labels (unchanged)
            ADSB_MAX_RADIUS_NM: 250,      // hard API limit of adsb.lol point queries

            MARKER_CAP_LOW_ZOOM: 2000,    // perf guard: max DOM markers when zoomed out
            MARKER_CAP_MAX_ZOOM: 5,       // only apply the cap at zoom ≤ 5 (world views)

            VIEW_FETCH_DEBOUNCE_MS: 1500, // let the user finish panning before refetching
            SOURCE_FAIL_THRESHOLD: 3,     // consecutive failures before a source is benched

            // [ADDED 2026-08-30 — incident #3] optional CARTO Dark Matter key.
            // CARTO raster tiles are watermarked without a key (and the keyless
            // service is being retired). Free key: https://carto.com/basemaps/apikey
            // Leave empty ('') to use the default key-free Esri dark basemap.
            CARTO_KEY: ''
        };

        // PURE-LOGIC-START
        // Everything inside the marked region below is free of DOM, network and
        // Leaflet dependencies. test/app.test.mjs extracts exactly this block
        // and unit-tests it in Node — keep it that way.

        const DEG = Math.PI / 180;
        const M_PER_DEG_LAT = 111320;     // metres of latitude per degree (approx.)
        const MS_PER_KT = 0.514444;       // knots → metres/second
        const FT_PER_M = 3.28084;         // metres → feet (popup display only)

        // Live data-source base URLs (single source of truth for the app AND tests).
        // [CHANGED 2026-08-30 — incident #3] the zoomed-in "point query" family now
        // fans out across TWO community ADS-B APIs (both ADSB-X-compatible schema):
        //   1. adsb.fi  — opendata.adsb.fi/api, /v3/lat/…/lon/…/dist/… (≤250 NM,
        //                 1 req/s, richest airframe data incl. descriptions)
        //   2. adsb.lol — api.adsb.lol/v2, /lat/…/lon/…/dist/…   (≤250 NM)
        // Whichever the user's browser can actually reach serves the data; the
        // engine tries them in order, then falls back to OpenSky.
        const ADSB_SOURCES = [
            { healthKey: 'adsbfi', base: 'https://opendata.adsb.fi/api',
              path: (lat, lon, d) => `/v3/lat/${lat}/lon/${lon}/dist/${d}` },
            { healthKey: 'adsblol', base: 'https://api.adsb.lol/v2',
              path: (lat, lon, d) => `/lat/${lat}/lon/${lon}/dist/${d}` }
        ];
        const OPENSKY_URL_BASE = 'https://opensky-network.org/api/states/all';

        // Coerce "maybe a number" API fields; returns null instead of NaN.
        function num(v) {
            const n = typeof v === 'number' ? v : parseFloat(v);
            return Number.isFinite(n) ? n : null;
        }

        // Wrap longitude into [-180, 180) — keeps dead-reckoned positions sane
        // across the antimeridian.  [FIX] the old code never wrapped.
        function normLon(lon) {
            let l = ((lon + 180) % 360 + 360) % 360 - 180;
            if (l === 180) l = -180;
            return l;
        }

        // Shortest-path angle interpolation.
        // [FIX] old code assigned raw headings, so 350° → 10° animated the long
        // way round (a 340° spin through south). Returning from+delta keeps the
        // marker's accumulated angle monotonic along the shortest arc.
        function shortestAngle(from, to) {
            let d = (to - from) % 360;
            if (d > 180) d -= 360;
            if (d < -180) d += 360;
            return from + d;
        }

        // Great-circle distance in nautical miles (view-radius calculations).
        function haversineNm(lat1, lon1, lat2, lon2) {
            const dLat = (lat2 - lat1) * DEG;
            const dLon = (lon2 - lon1) * DEG;
            const a = Math.sin(dLat / 2) ** 2 +
                      Math.cos(lat1 * DEG) * Math.cos(lat2 * DEG) * Math.sin(dLon / 2) ** 2;
            return 6371000 / 1852 * 2 * Math.asin(Math.min(1, Math.sqrt(a)));
        }

        // ── Dead reckoning ──
        // Advance lat/lon along `trackDeg` (degrees clockwise from true north) at
        // `velMs` (m/s) for `dtSec` seconds. Returns [lat, lon].
        function deadReckon(lat, lon, trackDeg, velMs, dtSec) {
            if (!(velMs > 0) || !(dtSec > 0) || !Number.isFinite(dtSec)) return [lat, lon];
            const t = trackDeg * DEG;
            const newLat = Math.max(-89.9, Math.min(89.9,
                lat + (velMs * Math.cos(t) * dtSec) / M_PER_DEG_LAT));
            const cosLat = Math.max(Math.cos(newLat * DEG), 0.02); // guard near poles
            const newLon = normLon(lon + (velMs * Math.sin(t) * dtSec) / (M_PER_DEG_LAT * cosLat));
            return [newLat, newLon];
        }

        // Predict where an aircraft is *now*, given its last fix. Extrapolation is
        // capped so a vanished/silent aircraft freezes instead of flying to infinity.
        function predictPos(m, nowMs, maxAgeMs) {
            const dtSec = Math.min(Math.max((nowMs - m.fixMs) / 1000, 0), maxAgeMs / 1000);
            return deadReckon(m.lat, m.lon, m.track, m.vel, dtSec);
        }

        // ── OpenSky credit maths (anonymous tier: 400 credits/day) ──
        // https://openskynetwork.github.io/opensky-api/rest.html — /states/all cost
        // scales with bounding-box area: ≤25 sq° → 1, ≤100 → 2, ≤400 → 3, else 4.
        function estimateOpenSkyCredits(areaSqDeg) {
            if (areaSqDeg <= 25) return 1;
            if (areaSqDeg <= 100) return 2;
            if (areaSqDeg <= 400) return 3;
            return 4;
        }

        // Build an OpenSky viewport query. Lats are clamped to ±85 (Web-Mercator
        // limit) and a dateline-crossing view degrades to a world query.
        function buildOpenSkyQuery(south, west, north, east) {
            const lamin = Math.max(-85, Math.min(85, south));
            const lamax = Math.max(-85, Math.min(85, north));
            let lomin = Math.max(-180, Math.min(180, west));
            let lomax = Math.max(-180, Math.min(180, east));
            if (lomin > lomax) { lomin = -180; lomax = 180; } // view crosses ±180°
            const area = (lamax - lamin) * (lomax - lomin);
            const params = `lamin=${lamin.toFixed(4)}&lomin=${lomin.toFixed(4)}` +
                           `&lamax=${lamax.toFixed(4)}&lomax=${lomax.toFixed(4)}`;
            return {
                url: `${OPENSKY_URL_BASE}?${params}`,
                area: area,
                credits: estimateOpenSkyCredits(area)
            };
        }

        // Community ADS-B point query: aircraft within `distNm` of (lat, lon).
        // [CHANGED 2026-08-30] source-indexed so the engine can try adsb.fi (0)
        // and adsb.lol (1) in turn — both speak the ADSB-X schema.
        function buildAdsbUrl(srcIdx, lat, lon, distNm) {
            const s = ADSB_SOURCES[Math.max(0, Math.min(ADSB_SOURCES.length - 1, srcIdx))];
            const d = Math.max(1, Math.min(250, Math.round(distNm)));
            return s.base + s.path((+lat).toFixed(4), normLon(lon).toFixed(4), d);
        }

        /* Normalised aircraft model shared by both sources:
           { id, callsign, country, lat, lon, track, vel, altM, reg, actype,
             fixMs, source }                                                            */

        // OpenSky /states/all state-vector array → models.
        // [FIX] altitude now falls back geo → barometric (was geo-only: null baro
        //       flights displayed "0 m"), and fixMs accounts for the age of the
        //       fix (time_position) so dead reckoning starts from the right instant.
        function normalizeOpenSky(states, nowMs) {
            const out = [];
            if (!Array.isArray(states)) return out;
            for (const s of states) {
                if (!Array.isArray(s) || s.length < 11) continue;
                if (s[8] === true) continue;                       // on the ground
                const lon = num(s[5]), lat = num(s[6]);
                if (lat === null || lon === null) continue;        // no position yet
                const altM = num(s[13]) !== null ? num(s[13]) : num(s[7]); // geo→baro
                const tPos = num(s[3]) !== null ? num(s[3]) : num(s[4]);   // time_position (s)
                const ageSec = tPos === null ? 0
                             : Math.min(Math.max(nowMs / 1000 - tPos, 0), 60);
                out.push({
                    id: String(s[0]),
                    callsign: String(s[1] || '').trim() || 'N/A',
                    country: String(s[2] || 'Unknown'),
                    lat: lat, lon: normLon(lon),
                    track: num(s[10]) || 0,          // true track (deg from north)
                    vel: num(s[9]) || 0,             // ground speed (m/s)
                    altM: altM,
                    reg: null, actype: null,
                    fixMs: nowMs - ageSec * 1000,
                    source: 'opensky'
                });
            }
            return out;
        }

        // Community ADS-B (ADSB-X-compatible) `ac` array → models. Works for both
        // adsb.fi v3 and adsb.lol v2 — identical field shapes.
        // alt_baro is feet, gs is knots, seen_pos is seconds since last position.
        function normalizeAdsb(acList, nowMs) {
            const out = [];
            if (!Array.isArray(acList)) return out;
            for (const a of acList) {
                if (!a || typeof a !== 'object') continue;
                if (a.alt_baro === 'ground') continue;             // ground aircraft
                const lon = num(a.lon), lat = num(a.lat);
                if (lat === null || lon === null) continue;
                const gsKt = num(a.gs);
                const altFt = num(a.alt_baro);
                const ageSec = Math.min(Math.max(num(a.seen_pos) || 0, 0), 60);
                out.push({
                    id: String(a.hex || '').toLowerCase() || ('anon-' + lat + ',' + lon),
                    callsign: String(a.flight || '').trim() || 'N/A',
                    country: null,                                  // not provided
                    lat: lat, lon: normLon(lon),
                    track: num(a.track) !== null ? num(a.track)
                          : (num(a.calc_track) || 0),
                    vel: gsKt === null ? 0 : gsKt * MS_PER_KT,      // kt → m/s
                    altM: altFt === null ? null : altFt / FT_PER_M, // ft → m
                    reg: a.r ? String(a.r) : null,
                    // adsb.fi additionally serves `desc` ("AIRBUS A-350-900")
                    actype: (a.t ? String(a.t) : null) ||
                            (a.desc ? String(a.desc) : null),
                    fixMs: nowMs - ageSec * 1000,
                    source: 'adsb'
                });
            }
            return out;
        }

        // PURE-LOGIC-END

        // ── Map initialisation (unchanged from v1) ────────────────────────────
        const map = L.map('map', {
            center: [19.4326, -99.1332],
            zoom: 4,
            zoomControl: false
        });

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        /* ── Basemap selection ────────────────────────────────────────────────
           [CHANGED 2026-08-30 — incident #3] CARTO began watermarking keyless
           raster tiles ("API key required") and is retiring that service, so the
           DEFAULT basemap is now Esri's key-free World Dark Gray canvas (same
           dark aesthetic, no watermark, no key). To restore the original CARTO
           Dark Matter look, request a free key at https://carto.com/basemaps/apikey
           (fair use: 5M tiles/month) and set CONFIG.CARTO_KEY below. */
        const DATA_ATTR = 'data: <a href="https://opensky-network.org" rel="noopener noreferrer">OpenSky Network</a> &amp; <a href="https://adsb.fi" rel="noopener noreferrer">adsb.fi</a>/<a href="https://adsb.lol" rel="noopener noreferrer">adsb.lol</a>';

        let darkTileLayer;       // primary base layer (CARTO keyed OR Esri dark gray)
        let darkRefLayer = null; // Esri reference overlay (labels/borders), if used

        if (CFG.CARTO_KEY) {
            // Opt-in: original CARTO Dark Matter with the owner's free API key.
            darkTileLayer = L.tileLayer(
                `https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png?key=${encodeURIComponent(CFG.CARTO_KEY)}`, {
                attribution: '&copy; <a href="https://carto.com/" rel="noopener noreferrer">CARTO</a> &copy; <a href="https://www.openstreetmap.org/copyright" rel="noopener noreferrer">OpenStreetMap</a> contributors &middot; ' + DATA_ATTR,
                subdomains: 'abcd', maxZoom: 20,
                keepBuffer: 4, updateWhenIdle: false, updateWhenZooming: false
            }).addTo(map);
        } else {
            // Default: Esri World Dark Gray canvas — key-free, watermark-free.
            darkTileLayer = L.tileLayer(
                'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ, &copy; <a href="https://www.openstreetmap.org/copyright" rel="noopener noreferrer">OpenStreetMap</a> contributors &middot; ' + DATA_ATTR,
                maxNativeZoom: 16, maxZoom: 20,
                keepBuffer: 4, updateWhenIdle: false, updateWhenZooming: false
            }).addTo(map);
            // Reference overlay adds place labels & borders on top of the base.
            darkRefLayer = L.tileLayer(
                'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
                attribution: '', maxNativeZoom: 16, maxZoom: 20, opacity: 0.85
            }).addTo(map);
        }

        // ── Basemap resilience ────────────────────────────────────────────────
        // [ADDED 2026-08-30 — incident #2] if the primary basemap CDN is
        // unreachable from the user's network, every tile errors and the map
        // appears "not loading at all". After repeated tile errors with ZERO
        // successes, swap to OpenStreetMap tiles tinted dark via CSS (keeps the
        // visual style) so the radar keeps working anywhere. Partial errors (a
        // few missing tiles) are normal and never trigger the switch.
        let tileErrors = 0, tileSuccesses = 0, tileWindowStart = Date.now();
        let usingFallbackTiles = false;

        function switchToFallbackTiles() {
            if (usingFallbackTiles) return;
            usingFallbackTiles = true;
            map.removeLayer(darkTileLayer);
            if (darkRefLayer) map.removeLayer(darkRefLayer);
            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                className: 'osm-dark-filter',
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" rel="noopener noreferrer">OpenStreetMap</a> contributors &middot; ' + DATA_ATTR
            }).addTo(map);
            statusEl.textContent = 'Primary basemap unreachable — using OSM fallback';
            statusEl.style.color = '#ffaa00';
        }

        darkTileLayer.on('tileload', () => { tileSuccesses++; });
        darkTileLayer.on('tileerror', () => {
            if (usingFallbackTiles || tileSuccesses > 0) return;
            const now = Date.now();
            if (now - tileWindowStart > 15000) { tileWindowStart = now; tileErrors = 0; }
            if (++tileErrors >= 5) switchToFallbackTiles();
        });

        // ── Runtime state ──────────────────────────────────────────────────────
        const statusEl = document.getElementById('status');

        const flights = new Map();     // id → { m: model, marker, dispTrack }
        let fetchInFlight = false;     // [FIX] guard against overlapping fetches
        let pollTimer = null;          // self-scheduling poll (replaces setInterval)
        let tickTimer = null;          // dead-reckoning interval
        let viewFetchTimer = null;     // debounced refetch after panning
        let backoff = 1;               // exponential back-off multiplier (×2 … ×8)
        let lastPlanKey = '';          // identity of the last executed query
        let lastPlanCredits = 4;       // credit cost of that query (poll interval)
        let activeSource = null;       // source of the last successful dataset
        // [CHANGED 2026-08-30 — incident #3] per-endpoint health: adsbfi, adsblol,
        // opensky. The user's diag run showed BOTH original APIs unreachable from
        // their browser — so the engine now fans out across every endpoint and
        // benches one only after repeated consecutive failures.
        const sourceFails = { adsbfi: 0, adsblol: 0, opensky: 0 };

        const PLANE_SVG_PATH =
            'M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z';

        // Cache media query once; update on resize for accurate icon sizing
        const mqlSmall = window.matchMedia('(max-width: 480px)');
        let isSmallScreen = mqlSmall.matches;
        mqlSmall.addEventListener('change', e => { isSmallScreen = e.matches; });

        // Simple HTML escaper to prevent XSS from API data.
        // [FIX] now also used for tooltip labels and the new reg/type fields.
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // Max dead-reckoning age for the current zoom (freeze sooner when close in,
        // where extrapolation error is visible; tolerate more at world scale).
        function maxDrAgeMs() {
            return map.getZoom() >= 6 ? CFG.MAX_DR_AGE_LOCAL_MS : CFG.MAX_DR_AGE_GLOBAL_MS;
        }

        // ── Popup / label builders (same layout as v1, values kept fresh) ─────
        function popupHtml(m) {
            const alt = m.altM === null ? '—' : Math.round(m.altM).toLocaleString() + ' m';
            const speed = Math.round((m.vel || 0) * 3.6).toLocaleString() + ' km/h';
            const hdg = Math.round(m.track) + '°';
            // OpenSky reports the aircraft's country; adsb.lol reports the airframe
            // registration and type instead — show whichever the source provides.
            const identity = m.source === 'adsb'
                ? `Aircraft: ${escapeHtml(m.actype || '—')}${m.reg ? ' &middot; ' + escapeHtml(m.reg) : ''}`
                : `Origin: ${escapeHtml(m.country || 'Unknown')}`;
            return '<strong style="font-size:15px;display:block;border-bottom:1px solid #444;padding-bottom:6px;margin-bottom:6px;">✈ ' +
                   escapeHtml(m.callsign) + '</strong>' +
                   '<div style="font-size:12px;line-height:1.7;color:#ccc;">' +
                   identity + '<br>' +
                   'Altitude: ' + alt + '<br>' +
                   'Speed: ' + speed + '<br>' +
                   'Heading: ' + hdg + '</div>';
        }

        // ── Marker rendering (viewport-culled for perf, same visuals as v1) ────
        function inView(bounds, lat, lon) {
            // [FIX] also test the longitude wrapped by ±360° so aircraft just
            // across the antimeridian from the viewport are not culled.
            if (bounds.contains([lat, lon])) return true;
            return bounds.contains([lat, lon > 0 ? lon - 360 : lon + 360]);
        }

        function createPlaneMarker(f, latLng) {
            const screenSize = isSmallScreen ? 16 : 20;
            const iconHtml = `<div class="plane-wrapper" style="transform:rotate(${f.dispTrack}deg)">
                <svg width="${screenSize}" height="${screenSize}" viewBox="0 0 24 24" fill="#fff" aria-hidden="true">
                    <path d="${PLANE_SVG_PATH}"/>
                </svg></div>`;

            const marker = L.marker(latLng, {
                icon: L.divIcon({
                    className: 'plane-icon',
                    html: iconHtml,
                    iconSize: [screenSize, screenSize],
                    iconAnchor: [screenSize / 2, screenSize / 2]
                })
            });

            marker.bindPopup(popupHtml(f.m));
            marker.addTo(map);
            return marker;
        }

        // Create / update / cull markers so the DOM matches the `flights` model.
        // Called on every fix and on map move — positions are the dead-reckoned
        // "now" positions, not the raw fix positions.
        function syncMarkers() {
            const bounds = map.getBounds().pad(0.2);
            const zoom = map.getZoom();
            const showLabels = zoom >= CFG.LABEL_ZOOM;
            const now = Date.now();
            const ageCap = maxDrAgeMs();

            // [FIX] perf guard: at world zoom OpenSky can return ~9–10k aircraft;
            // creating that many DOM nodes janks hard on phones. Render every
            // n-th aircraft instead (uniform spread, visually identical density).
            const stride = (zoom <= CFG.MARKER_CAP_MAX_ZOOM &&
                            flights.size > CFG.MARKER_CAP_LOW_ZOOM)
                ? Math.ceil(flights.size / CFG.MARKER_CAP_LOW_ZOOM) : 1;

            let idx = 0;
            for (const [id, f] of flights) {
                idx++;

                if (stride > 1 && (idx % stride) !== 1) {
                    if (f.marker) { map.removeLayer(f.marker); f.marker = null; }
                    continue;
                }

                const pos = predictPos(f.m, now, ageCap);

                if (!inView(bounds, pos[0], pos[1])) {
                    // Off-screen — remove if it was visible before
                    if (f.marker) { map.removeLayer(f.marker); f.marker = null; }
                    continue;
                }

                if (f.marker) {
                    // Update existing marker: position + freshest popup/label data.
                    // [FIX] v1 bound popup/tooltip once at creation, so altitude,
                    // speed and callsign were frozen at first sight forever.
                    f.marker.setLatLng(pos);
                    f.marker.setPopupContent(popupHtml(f.m));
                    if (showLabels) {
                        const label = escapeHtml(f.m.callsign);
                        if (!f.marker.getTooltip()) {
                            f.marker.bindTooltip(label, {
                                permanent: true, direction: 'top',
                                className: 'plane-label', offset: [0, -12]
                            });
                        } else {
                            f.marker.setTooltipContent(label);
                        }
                    } else if (f.marker.getTooltip()) {
                        f.marker.unbindTooltip();
                    }
                } else {
                    f.dispTrack = f.dispTrack === undefined ? f.m.track : f.dispTrack;
                    f.marker = createPlaneMarker(f, pos);
                    if (showLabels) {
                        f.marker.bindTooltip(escapeHtml(f.m.callsign), {
                            permanent: true, direction: 'top',
                            className: 'plane-label', offset: [0, -12]
                        });
                    }
                }
            }
        }

        // ── Dead-reckoning tick ────────────────────────────────────────────────
        // Once a second, advance every rendered aircraft along its track at its
        // reported ground speed. The 1 s CSS transition on `.plane-icon` turns
        // these discrete updates into a continuous glide.  [FIX] v1 just let
        // markers sit still and teleport on each 15 s poll.
        function tick() {
            if (document.hidden || flights.size === 0) return;
            const now = Date.now();
            const ageCap = maxDrAgeMs();
            for (const f of flights.values()) {
                if (!f.marker) continue;
                const pos = predictPos(f.m, now, ageCap);
                f.marker.setLatLng(pos);
                // [FIX] rotate along the shortest arc (no 360° spin-back)
                f.dispTrack = shortestAngle(f.dispTrack, f.m.track);
                const el = f.marker.getElement();
                if (el) {
                    const wrapper = el.querySelector('.plane-wrapper');
                    if (wrapper) wrapper.style.transform = `rotate(${f.dispTrack}deg)`;
                }
            }
        }

        // ── Query planning: pick the best source chain for the current view ───
        // [CHANGED 2026-08-30] adsb endpoints are an ordered fan-out list, so a
        // network that cannot reach adsb.fi (or CORS-blocks it) automatically
        // tries adsb.lol next, then OpenSky.
        function sourceHealthy(key) {
            return sourceFails[key] < CFG.SOURCE_FAIL_THRESHOLD;
        }

        function healthyAdsbIndices() {
            const idx = [];
            ADSB_SOURCES.forEach((s, i) => { if (sourceHealthy(s.healthKey)) idx.push(i); });
            return idx;
        }

        function adsbCandidate(srcIdx, lat, lon, dist) {
            return {
                source: 'adsb', adsbIdx: srcIdx,
                url: buildAdsbUrl(srcIdx, lat, lon, dist),
                credits: 0, healthKey: ADSB_SOURCES[srcIdx].healthKey
            };
        }

        function planQuery() {
            const c = map.getCenter();
            const b = map.getBounds();
            const ne = b.getNorthEast(), sw = b.getSouthWest();

            // Radius from the view centre to the farthest corner (nautical miles)
            const radiusNm = Math.max(
                haversineNm(c.lat, c.lng, ne.lat, ne.lng),
                haversineNm(c.lat, c.lng, sw.lat, sw.lng)
            );

            const adsbIdxs = healthyAdsbIndices();

            // Zoomed in enough for a ≤250 NM point query to blanket the view?
            // → 12 s refresh, richer airframe data, no credits. Try each
            //   community API in turn, then OpenSky as the final fallback.
            if (adsbIdxs.length > 0 && radiusNm <= CFG.ADSB_MAX_RADIUS_NM) {
                const dist = Math.ceil(radiusNm * 1.2);             // small margin
                const dLat = dist / 60;                             // 1° lat = 60 nm
                const dLon = dLat / Math.max(Math.cos(c.lat * DEG), 0.05);
                const fb = buildOpenSkyQuery(c.lat - dLat, c.lng - dLon,
                                             c.lat + dLat, c.lng + dLon);
                return {
                    key: `adsb:${adsbIdxs.join(',')}:${c.lat.toFixed(1)}:${c.lng.toFixed(1)}:${dist}`,
                    primary: adsbCandidate(adsbIdxs[0], c.lat, c.lng, dist),
                    fallbacks: [
                        ...adsbIdxs.slice(1).map(i => adsbCandidate(i, c.lat, c.lng, dist)),
                        { source: 'opensky', url: fb.url, credits: fb.credits, healthKey: 'opensky' }
                    ]
                };
            }

            // Zoomed out (or both community APIs benched) → OpenSky viewport
            // query.  [FIX] v1 always requested the whole planet (4 credits a pop).
            const q = buildOpenSkyQuery(b.getSouth(), b.getWest(), b.getNorth(), b.getEast());
            return {
                key: `opensky:${q.area.toFixed(0)}`,
                primary: { source: 'opensky', url: q.url, credits: q.credits, healthKey: 'opensky' },
                fallbacks: adsbIdxs.length > 0
                    ? [adsbCandidate(adsbIdxs[0], c.lat, c.lng, CFG.ADSB_MAX_RADIUS_NM)]
                    : []
            };
        }

        // ── Data fetching ──────────────────────────────────────────────────────
        // Feature-detected timeout: [FIX] AbortSignal.timeout() throws a
        // TypeError on older Safari/Firefox, which killed the v1 fetch loop.
        function timeoutSignal(ms) {
            try {
                return (typeof AbortSignal !== 'undefined' && AbortSignal.timeout)
                    ? AbortSignal.timeout(ms) : undefined;
            } catch { return undefined; }
        }

        async function fetchModels(candidate) {
            const response = await fetch(candidate.url, {
                cache: 'no-store',
                signal: timeoutSignal(CFG.FETCH_TIMEOUT_MS)
            });

            if (response.status === 429) {            // rate limited
                const err = new Error('HTTP 429');
                err.rateLimited = true;
                throw err;
            }
            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            const data = await response.json();
            // [CHANGED 2026-08-30] both community APIs share the ADSB-X schema,
            // so one normalizer serves adsb.fi and adsb.lol alike.
            const models = candidate.source === 'adsb'
                ? normalizeAdsb(data && data.ac, Date.now())
                : normalizeOpenSky(data && data.states, Date.now());

            if (models === null || models === undefined) {
                throw new Error(`Unexpected API response from ${candidate.healthKey}`);
            }
            return models;
        }

        // Merge a fresh dataset into the model store, then re-render.
        function applyFixes(models) {
            const seen = new Set();
            for (const m of models) {
                seen.add(m.id);
                const f = flights.get(m.id);
                if (f) {
                    f.m = m;                          // keep marker, refresh data
                } else {
                    flights.set(m.id, { m: m, marker: null, dispTrack: m.track });
                }
            }
            for (const id of Array.from(flights.keys())) {
                if (!seen.has(id)) {
                    const f = flights.get(id);
                    if (f.marker) map.removeLayer(f.marker);
                    flights.delete(id);
                }
            }
            syncMarkers();
        }

        function scheduleNextPoll(plan) {
            clearTimeout(pollTimer);
            const base = plan.primary.source === 'adsb' ? CFG.ADSB_POLL_MS
                        : (plan.primary.credits >= 3 ? CFG.OPENSKY_POLL_GLOBAL_MS
                                                     : CFG.OPENSKY_POLL_MS);
            pollTimer = setTimeout(refresh, base * backoff);
        }

        async function refresh() {
            if (fetchInFlight || document.hidden) return;
            fetchInFlight = true;
            clearTimeout(pollTimer);

            const plan = planQuery();
            lastPlanKey = plan.key;
            lastPlanCredits = plan.primary.credits || 4;

            let models = null;
            let rateLimited = false;

            // [CHANGED 2026-08-30 — incident #3] walk the whole candidate chain:
            // primary → every fallback. Whichever endpoint the user's browser can
            // actually reach (network + CORS) serves the data; the rest are
            // health-tracked and benched after repeated failures.
            const candidates = [plan.primary, ...plan.fallbacks];
            for (const cand of candidates) {
                if (models) break;
                try {
                    models = await fetchModels(cand);
                    sourceFails[cand.healthKey] = 0;
                } catch (err) {
                    if (err.rateLimited) rateLimited = true;
                    sourceFails[cand.healthKey]++;
                    console.warn('[FlightRadar] source failed:',
                                 cand.healthKey, err.message);
                }
            }

            try {
                if (models) {
                    activeSource = models.length ? models[0].source : plan.primary.source;
                    applyFixes(models);
                    backoff = 1;                       // healthy again → normal cadence
                    const noun = activeSource === 'adsb' ? 'airborne flights'
                                                       : 'global airborne flights';
                    statusEl.textContent =
                        `Tracking ${flights.size.toLocaleString()} ${noun}`;
                    statusEl.style.color = '#ccc';
                } else if (rateLimited) {
                    // Same "holding pattern" UX as v1, but now with back-off so we
                    // stop hammering an exhausted quota.
                    backoff = Math.min(backoff * 2, 8);
                    statusEl.textContent = 'Radar congested (rate limit). Holding pattern…';
                    statusEl.style.color = '#ffaa00';
                } else {
                    throw new Error('all sources failed');
                }

            } catch (err) {
                backoff = Math.min(backoff * 2, 8);
                statusEl.textContent = err.name === 'AbortError'
                    ? 'Radar timeout. Reconnecting…'
                    : 'Radar connection interrupted. Reconnecting…';
                statusEl.style.color = '#ff4444';
                console.error('[FlightRadar] fetch error:', err.message);
            } finally {
                fetchInFlight = false;
                scheduleNextPoll(plan);
            }
        }

        // ── Map event wiring ───────────────────────────────────────────────────
        let renderPending = false;
        function scheduleRender() {
            if (renderPending) return;
            renderPending = true;
            requestAnimationFrame(() => {
                syncMarkers();
                renderPending = false;
            });
        }

        // After the user pans/zooms: re-cull immediately from cached data, then
        // (if the view moved into a different query region) refetch, debounced.
        function onMoveEnd() {
            scheduleRender();
            const plan = planQuery();
            if (plan.key !== lastPlanKey) {
                clearTimeout(viewFetchTimer);
                viewFetchTimer = setTimeout(refresh, CFG.VIEW_FETCH_DEBOUNCE_MS);
            }
        }

        map.on('moveend', onMoveEnd);
        map.on('resize', scheduleRender);

        // Suspend the glide transition while zooming so re-projected markers
        // don't drift behind the tiles (class removed shortly after zoomend).
        map.on('zoomstart', () => map.getContainer().classList.add('map-zooming'));
        map.on('zoomend', () => {
            setTimeout(() => map.getContainer().classList.remove('map-zooming'), 150);
        });

        // [FIX] v1 kept polling in background tabs, burning the daily OpenSky
        // quota (and battery) while nobody was watching.
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                clearTimeout(pollTimer);
                clearTimeout(viewFetchTimer);
            } else {
                refresh();                              // immediate catch-up
            }
        });

        // ── Boot ───────────────────────────────────────────────────────────────
        refresh();                                      // initial fetch
        tickTimer = setInterval(tick, CFG.DR_TICK_MS); // dead-reckoning heartbeat
    </script>
</body>
</html>
